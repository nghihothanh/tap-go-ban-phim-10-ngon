<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F1F6">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest?v=6">
<link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<title>Phím Vàng - Tập gõ 10 ngón</title>
<style>
/* ---------- Bảng màu (lấy từ thư mục Colour Theme) ----------
   Sáng: nền và chữ theo Luxury Purple Light, nút và phím đích theo Technology Gold Light.
   Tối:  nền và chữ theo Luxury Purple Dark,  nút và phím đích theo Technology Gold Dark. */
:root {
  --bg: #F4F1F6;
  --bg-img: url("img/bg-light.webp");
  --surface: #FFFFFF;
  --surface-2: #F9F7FB;
  --border: #DDD6E3;
  --heading: #0D0B10;
  --text: #3B3740;
  --muted: #7A7482;
  --gold-1: #B99743;
  --gold-2: #E8D58C;
  --gold-3: #C5A34A;
  --gold-deep: #8A6A1F;
  --on-gold: #202124;
  --pur-1: #6A4A8E;
  --pur-2: #D2C0E8;
  --pur-3: #8B68B3;
  --on-purple: #0D0B10;
  --purple: #5B3A78;
  --ok: #2E9E5B;
  --bad: #D93F4C;
  --key-text: #0D0B10;
  --key-mix: 26%;
  --shadow: 0 1px 0 rgba(13, 11, 16, .10), 0 6px 18px rgba(91, 58, 120, .12);

  /* Màu từng ngón tay */
  --f-lp: #E5484D; --f-lr: #F08C2E; --f-lm: #D9B11F; --f-li: #3FAE6A;
  --f-ri: #2FA7B8; --f-rm: #3B82E0; --f-rr: #7C5CE0; --f-rp: #D452A8;
  --f-th: #9A9AA0;

  --u: min(6.2vw, 9.2dvh);     /* một đơn vị phím */
  --gap: calc(var(--u) * .09);
}
:root[data-theme="dark"] {
  --bg: #18151A;
  --bg-img: url("img/bg-dark.webp");
  --surface: #221E25;
  --surface-2: #2A2530;
  --border: #7A5C99;
  --heading: #DCD0E8;
  --text: #CDC8D2;
  --muted: #9C94A6;
  --gold-1: #D2AC47;
  --gold-2: #F7EF8A;
  --gold-3: #C5A34A;
  --gold-deep: #F4E883;
  --on-gold: #0D0D09;
  --purple: #B9A0D6;
  --ok: #5FD08C;
  --bad: #FF6B78;
  --key-text: #F4EEFA;
  --key-mix: 34%;
  --shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 8px 22px rgba(0, 0, 0, .40);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  color: var(--text);
  background: var(--bg-img) center / cover no-repeat, var(--bg);
  height: 100dvh;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-columns: minmax(0, 1fr);
  gap: calc(var(--u) * .16);
  padding: calc(var(--u) * .18) calc(var(--u) * .3) calc(var(--u) * .22);
  padding-left: max(calc(var(--u) * .3), env(safe-area-inset-left));
  padding-right: max(calc(var(--u) * .3), env(safe-area-inset-right));
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.purple { background: linear-gradient(100deg, var(--pur-1) 5%, var(--pur-2) 45%, var(--pur-3) 85%); color: var(--on-purple); }
.gold { background: linear-gradient(100deg, var(--gold-1) 5%, var(--gold-2) 45%, var(--gold-3) 85%); color: var(--on-gold); }

/* ---------- Thanh trên ---------- */
header { display: flex; align-items: center; gap: calc(var(--u) * .22); min-height: calc(var(--u) * .72); }
.logo {
  width: calc(var(--u) * .66); height: calc(var(--u) * .66); border-radius: 26%;
  display: grid; place-items: center; font-weight: 800; font-size: calc(var(--u) * .36);
  box-shadow: var(--shadow), inset 0 -3px 0 rgba(0, 0, 0, .14);
}
h1 { font-size: calc(var(--u) * .36); color: var(--heading); font-weight: 800; letter-spacing: -.01em; white-space: nowrap; }
h1 small { font-size: .62em; font-weight: 600; color: var(--purple); margin-left: .5em; }
.spacer { flex: 1; }
.chip {
  display: flex; align-items: baseline; gap: .4em; white-space: nowrap;
  padding: calc(var(--u) * .1) calc(var(--u) * .22);
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  font-size: calc(var(--u) * .22); color: var(--muted);
}
.chip b { font-size: 1.3em; color: var(--heading); font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; }
.chip.ok b { color: var(--ok); } .chip.bad b { color: var(--bad); } .chip.acc b { color: var(--purple); }
button.btn {
  font: inherit; font-weight: 700; font-size: calc(var(--u) * .23); border: 0; cursor: pointer;
  padding: calc(var(--u) * .14) calc(var(--u) * .28); border-radius: 999px;
  box-shadow: var(--shadow);
}
button.btn:active { transform: translateY(1px); }

/* ---------- Khu vực giữa: tay trái | bài gõ | tay phải ---------- */
main { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: minmax(0, 1fr); gap: calc(var(--u) * .2); min-height: 0; }
.hand { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; width: calc(var(--u) * 2.5); }
.hand svg { width: 100%; height: auto; max-height: calc(100% - 1.6em); }
.hand span { font-size: calc(var(--u) * .2); font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.hand .palm { fill: var(--surface-2); stroke: var(--border); stroke-width: 2; }
.hand .fg { fill: color-mix(in srgb, var(--c) 30%, var(--surface)); stroke: var(--c); stroke-width: 2; }
.hand .fg.on { fill: var(--c); animation: pulse 1s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--u) * .32);
  box-shadow: var(--shadow); min-height: 0; position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--u) * .16); padding: calc(var(--u) * .2) calc(var(--u) * .3);
}
.card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--gold-1), var(--gold-2) 30%, var(--pur-2) 60%, var(--pur-1)); }
.eyebrow { font-size: calc(var(--u) * .2); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--purple); }
#prompt {
  font-family: ui-monospace, "Roboto Mono", "Cascadia Mono", Consolas, "Droid Sans Mono", monospace;
  font-size: calc(var(--u) * .62); font-weight: 600; line-height: 1.35; color: var(--muted);
  white-space: pre-wrap; text-align: center;
}
#prompt span { display: inline-block; min-width: .62em; border-radius: .14em; padding: 0 .04em; border-bottom: .09em solid transparent; }
#prompt .done { color: var(--ok); }
#prompt .cur { color: var(--on-gold); background: linear-gradient(100deg, var(--gold-1) 5%, var(--gold-2) 45%, var(--gold-3) 85%); border-bottom-color: var(--purple); }
#prompt .sp:not(.cur):not(.done) { border-bottom-color: var(--border); }
#prompt .sp.done { border-bottom-color: color-mix(in srgb, var(--ok) 45%, transparent); }
#prompt .cur.miss { background: var(--bad); color: #fff; animation: shake .25s; }
#hint { font-size: calc(var(--u) * .27); color: var(--text); min-height: 1.4em; text-align: center; }
#hint kbd {
  font: inherit; font-weight: 800; color: var(--on-gold); padding: .05em .5em; border-radius: .35em;
  background: linear-gradient(100deg, var(--gold-1) 5%, var(--gold-2) 45%, var(--gold-3) 85%);
}
#hint em { font-style: normal; font-weight: 800; color: var(--fc, var(--purple)); }
#diag { position: absolute; right: calc(var(--u) * .2); bottom: calc(var(--u) * .1); font-size: calc(var(--u) * .17); color: var(--muted); font-family: ui-monospace, monospace; opacity: .8; }
#warn { position: absolute; left: 0; right: 0; bottom: 0; padding: .5em 1em; font-size: calc(var(--u) * .21); font-weight: 600; text-align: center; background: var(--bad); color: #fff; }
#toast {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0; pointer-events: none;
  font-size: calc(var(--u) * .6); font-weight: 800; padding: .25em .9em; border-radius: 999px; box-shadow: var(--shadow);
  transition: transform .25s cubic-bezier(.2, 1.6, .4, 1), opacity .2s;
}
#toast.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }

/* ---------- Bàn phím ảo ---------- */
#kb { display: flex; flex-direction: column; gap: var(--gap); align-items: center; }
.row { display: flex; gap: var(--gap); }
.key {
  --c: var(--f-th);
  width: calc(var(--u) * var(--w, 1) - var(--gap)); height: calc(var(--u) - var(--gap));
  border-radius: calc(var(--u) * .16);
  background: color-mix(in srgb, var(--c) var(--key-mix), var(--surface));
  border: 1px solid color-mix(in srgb, var(--c) 55%, var(--surface));
  border-bottom-width: calc(var(--u) * .06);
  color: var(--key-text); font-weight: 700; font-size: calc(var(--u) * .34);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
  position: relative; transition: transform .06s;
}
.key i { font-style: normal; font-size: .62em; opacity: .65; margin-bottom: .12em; }
.key.wide { font-size: calc(var(--u) * .2); letter-spacing: .02em; }
.key.home::after { content: ""; position: absolute; bottom: 12%; width: 26%; height: calc(var(--u) * .045); border-radius: 9px; background: currentColor; opacity: .55; }
.key.next {
  background: linear-gradient(100deg, var(--gold-1) 5%, var(--gold-2) 45%, var(--gold-3) 85%);
  border-color: var(--gold-deep); color: var(--on-gold); z-index: 1;
  box-shadow: 0 0 0 calc(var(--u) * .05) var(--pur-3), 0 0 calc(var(--u) * .4) var(--gold-2);
  animation: pulse 1s ease-in-out infinite;
}
.key.down { transform: translateY(calc(var(--u) * .05)); border-bottom-width: 1px; background: color-mix(in srgb, var(--c) 70%, var(--surface)); }
.key.wrong { background: var(--bad) !important; color: #fff; animation: shake .25s; }
[data-f="lp"] { --c: var(--f-lp); } [data-f="lr"] { --c: var(--f-lr); } [data-f="lm"] { --c: var(--f-lm); } [data-f="li"] { --c: var(--f-li); }
[data-f="ri"] { --c: var(--f-ri); } [data-f="rm"] { --c: var(--f-rm); } [data-f="rr"] { --c: var(--f-rr); } [data-f="rp"] { --c: var(--f-rp); }
[data-f="lt"], [data-f="rt"] { --c: var(--f-th); }

@keyframes pulse { 50% { transform: scale(1.07); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Kết quả bài ---------- */
#note { font-size: calc(var(--u) * .24); color: var(--muted); text-align: center; }
#result {
  position: absolute; inset: 0; z-index: 3; background: var(--surface); display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * .12); padding: calc(var(--u) * .16) calc(var(--u) * .2);
}
#result.show { display: flex; }
#result h2 { font-size: calc(var(--u) * .44); color: var(--heading); text-align: center; }
.rstats { display: flex; gap: calc(var(--u) * .3); }
.rstat { display: flex; flex-direction: column; align-items: center; min-width: calc(var(--u) * 1.9); padding: calc(var(--u) * .12) calc(var(--u) * .2); background: var(--surface-2); border: 1px solid var(--border); border-radius: calc(var(--u) * .24); }
.rstat b { font-size: calc(var(--u) * .5); color: var(--heading); font-variant-numeric: tabular-nums; }
.rstat span { font-size: calc(var(--u) * .2); color: var(--muted); }
.rstat.good b { color: var(--ok); } .rstat.low b { color: var(--bad); }
#r-sub { font-size: calc(var(--u) * .25); color: var(--text); min-height: 1.3em; text-align: center; }
.rbtns { display: flex; gap: calc(var(--u) * .24); }
.rbtns .btn { font-size: calc(var(--u) * .28); padding: calc(var(--u) * .16) calc(var(--u) * .42); }

/* ---------- Bản đồ lộ trình ---------- */
main { grid-row: 2; grid-column: 1; }
#kb { grid-row: 3; }
#map { grid-row: 2; grid-column: 1; display: none; flex-direction: column; gap: calc(var(--u) * .1); min-height: 0; }
body.map-mode #map { display: flex; }
body.map-mode main, body.map-mode #kb, body.home-mode main, body.home-mode #kb { display: none; }

/* ---------- Thanh tiến độ buổi tập ---------- */
#top { display: flex; flex-direction: column; gap: calc(var(--u) * .1); }
#sbar { display: none; align-items: center; gap: calc(var(--u) * .24); }
body.in-sess #sbar { display: flex; }
#sb-name { flex: none; min-width: calc(var(--u) * 3.1); font-size: calc(var(--u) * .24); font-weight: 800; color: var(--heading); white-space: nowrap; }
#sb-name small { font-size: .8em; font-weight: 700; color: var(--muted); margin-left: .5em; }
#sb-segs { flex: 1; display: flex; gap: calc(var(--u) * .07); }
.seg { flex: var(--s) 1 0; height: calc(var(--u) * .2); border-radius: 999px; background: var(--surface); border: 1px solid var(--border); overflow: hidden; position: relative; }
.seg i { position: absolute; inset: 0 auto 0 0; width: var(--p, 0%); background: linear-gradient(100deg, var(--gold-1) 5%, var(--gold-2) 45%, var(--gold-3) 85%); }
.seg.cur { border-color: var(--pur-3); }
#sb-time { flex: none; min-width: calc(var(--u) * 2.9); text-align: right; font-size: calc(var(--u) * .24); font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
#sb-time.paused { color: var(--purple); font-weight: 800; }

/* ---------- Trang chủ và tổng kết buổi ---------- */
#home { grid-row: 2; grid-column: 1; display: none; text-align: center; }
body.home-mode #home { display: flex; }
body.home-mode .chip.ok, body.home-mode .chip.bad, body.home-mode .chip.acc { display: none; }
#home h2 { font-size: calc(var(--u) * .5); color: var(--heading); }
.elo-big { display: flex; align-items: baseline; gap: .45em; justify-content: center; }
.elo-big span { font-size: calc(var(--u) * .24); color: var(--muted); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.elo-big b { font-size: calc(var(--u) * 1.05); line-height: 1; color: var(--heading); font-variant-numeric: tabular-nums; }
.up { color: var(--ok); } .down { color: var(--bad); }
.elo-big em, .chip small { font-style: normal; font-weight: 800; }
.elo-big em { font-size: calc(var(--u) * .32); }
.chip small { font-size: .9em; }
#home .btn-big { font-size: calc(var(--u) * .46); padding: calc(var(--u) * .24) calc(var(--u) * .8); }
#home .btn-big:disabled { opacity: .6; cursor: default; }
.htext { font-size: calc(var(--u) * .24); color: var(--text); max-width: 90%; }
.htext.muted { color: var(--muted); }
#r-pts { font-size: calc(var(--u) * .32); font-weight: 800; min-height: 1.2em; }
#r-pts small { font-size: .7em; font-weight: 700; color: var(--muted); margin-left: .6em; }
.stage {
  flex: 1; min-height: 0; display: flex; align-items: center; gap: calc(var(--u) * .24); padding: 0 calc(var(--u) * .28);
  background: var(--surface); border: 1px solid var(--border); border-radius: calc(var(--u) * .26); box-shadow: var(--shadow);
}
.stage.locked > * { opacity: .55; }
.snum { flex: none; width: calc(var(--u) * .62); height: calc(var(--u) * .62); border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: calc(var(--u) * .32); }
.sinfo { flex: none; width: calc(var(--u) * 4.4); display: flex; flex-direction: column; gap: .15em; }
.sinfo b { font-size: calc(var(--u) * .3); color: var(--heading); white-space: nowrap; }
.sinfo b em { font-style: normal; font-size: .62em; font-weight: 700; margin-left: .6em; padding: .1em .6em; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); color: var(--purple); }
.sinfo small { font-size: calc(var(--u) * .19); color: var(--text); line-height: 1.25; }
.lessons { flex: 1; display: flex; flex-wrap: wrap; gap: calc(var(--u) * .1); align-content: center; }
.ls {
  font: inherit; font-weight: 800; font-size: calc(var(--u) * .22); cursor: pointer; flex: none;
  min-width: calc(var(--u) * .66); height: calc(var(--u) * .66); padding: 0 .35em; border-radius: 999px;
  border: 2px dashed var(--border); background: var(--surface-2); color: var(--muted);
}
.ls.open { border: 2px solid var(--pur-3); color: var(--heading); background: var(--surface); }
.ls.done { border: 2px solid var(--gold-deep); color: var(--on-gold); background: linear-gradient(100deg, var(--gold-1) 5%, var(--gold-2) 45%, var(--gold-3) 85%); }
.ls.now { box-shadow: 0 0 0 calc(var(--u) * .05) var(--pur-3), 0 0 calc(var(--u) * .3) var(--gold-2); animation: pulse 1s ease-in-out infinite; }
.ls:disabled { cursor: default; }

/* ---------- Nhắc xoay ngang ---------- */
#rotate { display: none; position: fixed; inset: 0; z-index: 9; background: var(--bg); color: var(--heading); place-items: center; text-align: center; padding: 2em; font-size: 5vw; font-weight: 800; }
#rotate div { font-size: 18vw; animation: tilt 1.6s ease-in-out infinite; }
@keyframes tilt { 50% { transform: rotate(90deg); } }
@media (orientation: portrait) { #rotate { display: grid; } }
</style>
</head>
<body>

<div id="top">
<header>
  <div class="logo gold">F</div>
  <h1>Phím Vàng<small>Tập gõ 10 ngón</small></h1>
  <div class="spacer"></div>
  <div class="chip ok">Đúng <b id="s-ok">0</b></div>
  <div class="chip bad">Sai <b id="s-bad">0</b></div>
  <div class="chip acc">Chính xác <b id="s-acc">--</b></div>
  <div class="chip elo" id="chip-elo" title="Điểm và mức thay đổi hôm nay">Điểm <b id="s-elo">800</b><small id="s-elod"></small></div>
  <button class="btn purple" id="btn-map" type="button">Lộ trình</button>
  <button class="btn gold" id="fs" type="button">Toàn màn hình</button>
</header>
<div id="sbar" aria-label="Buổi tập hôm nay">
  <div id="sb-name"></div>
  <div id="sb-segs"></div>
  <div id="sb-time"></div>
</div>
</div>

<main>
  <div class="hand" id="hand-l"></div>
  <section class="card">
    <div class="eyebrow" id="eyebrow"></div>
    <div id="prompt" aria-live="off"></div>
    <div id="hint"></div>
    <div id="note" hidden></div>
    <div id="diag">Chưa nhận phím nào</div>
    <div id="warn" hidden>Bàn phím đang bật bộ gõ tiếng Việt. Hãy chuyển sang English (US) để tập.</div>
    <div id="toast" class="gold"></div>
    <div id="result">
      <h2 id="r-title"></h2>
      <div class="rstats">
        <div class="rstat"><b id="r-acc">--</b><span>Chính xác</span></div>
        <div class="rstat"><b id="r-bad">0</b><span>Số lỗi</span></div>
        <div class="rstat"><b id="r-need">90%</b><span>Cần đạt</span></div>
      </div>
      <div id="r-pts"></div>
      <div id="r-sub"></div>
      <div class="rbtns" id="r-btns"></div>
    </div>
  </section>
  <div class="hand" id="hand-r"></div>
</main>

<section id="home" class="card" aria-label="Trang chủ"></section>
<section id="map" aria-label="Lộ trình"></section>

<div id="kb" aria-hidden="true"></div>

<div id="rotate"><div>&#x1F4F1;</div>Xoay ngang máy tính bảng để bắt đầu nhé!</div>

<script src="lessons.js"></script>
<script src="rating.js"></script>
<script>
'use strict';

/* ---------- Giao diện theo hệ thống ---------- */
(function () {
  const mq = matchMedia('(prefers-color-scheme: dark)');
  const forced = new URLSearchParams(location.search).get('theme'); // chỉ dùng để kiểm thử
  const apply = () => {
    const dark = forced ? forced === 'dark' : mq.matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name=theme-color]').content = dark ? '#18151A' : '#F4F1F6';
  };
  mq.addEventListener('change', apply);
  apply();
})();

/* ---------- Dữ liệu bàn phím: [code, nhãn, nhãn khi giữ Shift, ngón, độ rộng] ---------- */

const SAVE_KEY = 'phimvang.progress';   // một khóa duy nhất cho mọi dữ liệu; bước sau mở rộng thêm trường
const SAVE_VER = 2;                     // tăng khi đổi cấu trúc dữ liệu lưu hoặc id/thứ tự bài (tăng là xóa tiến độ cũ, trừ bản có hàm chuyển)
/* Dạng lưu v2:
   { v: 2, passed: { '1-1': { best: 96, tries: 2 } }, last: '1-2',

     days: { '2026-11-16': { start, end, gained, lost, seconds, lessons, ok, bad, done,

const R = RATING.CFG;
function freshSave() { return { v: SAVE_VER, passed: {}, last: null, rating: R.START, ratedCount: 0, days: {} }; }
let migrated = false;
function loadSave() {
  try {
    const o = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (o && typeof o === 'object' && o.passed && typeof o.passed === 'object') {
      if (o.v === 1) { o.v = 2; migrated = true; }          // v1 -> v2: giữ nguyên bài đã qua, thêm điểm và ngày
      if (o.v === SAVE_VER) {
        o.rating = Number.isFinite(o.rating) ? Math.max(R.MIN, Math.round(o.rating)) : R.START;
        o.ratedCount = Number.isFinite(o.ratedCount) && o.ratedCount > 0 ? Math.floor(o.ratedCount) : 0;
        if (!o.days || typeof o.days !== 'object' || Array.isArray(o.days)) o.days = {};

const st = { idx: 0, lines: [], line: 0, pos: 0, ok: 0, bad: 0, times: [], ctx: 'free' };

function loadLine() {
  promptEl.textContent = '';

  if (!t) return;
  keyEls[t.code].classList.add('next');
  const fingers = ch === ' ' ? ['lt', 'rt'] : [t.finger];
  let shiftTxt = '';
  if (t.shift) { // giữ Shift bằng ngón út của tay bên kia
    const sh = t.finger[0] === 'l' ? 'ShiftRight' : 'ShiftLeft';

const accNow = () => { const n = st.ok + st.bad; return n ? Math.round(st.ok * 100 / n) : null; };

function flash(el, cls, ms) {

function typeChar(ch, code) {
  if (mode !== 'lesson') return;
  st.times.push(performance.now());
  const want = curText()[st.pos];
  if (ch === want) {
    st.ok++; st.pos++;
    if (st.pos >= curText().length) {
      if (st.line + 1 >= st.lines.length) { stats(); finishLesson(); return; }
      toastEl.textContent = PRAISE[st.line % PRAISE.length];
      flash(toastEl, 'show', 900);
      st.line++;
      loadLine();
    } else showTarget();
  } else {
    st.bad++;
    flash(promptEl.children[st.pos], 'miss', 260);
    flash(keyEls[code], 'wrong', 260);
  }
  stats();
}

/* ---------- Kết quả bài ---------- */
let resultAction = null;   // việc của nút chính, để phím Enter dùng
function finishLesson() {
  const L = LESSONS[st.idx], acc = accNow(), pass = acc >= PV.CFG.PASS_ACCURACY;
  const rec = save.passed[L.id];
  if (pass) save.passed[L.id] = { best: Math.max(acc, rec ? rec.best : 0), tries: (rec ? rec.tries : 0) + 1 };
  else if (rec) rec.tries++;
  // Trong buổi tập: chấm điểm, cộng dồn số liệu của ngày, rồi ghi ngay để tắt app giữa chừng không mất
  let res = null, over = false;
  if (st.ctx === 'session' && sess) {
    const d = sess.day, part = PARTS[d.part];
    res = RATING.rateLesson({ rating: save.rating, index: st.idx, final: L.final, acc, ok: st.ok, times: st.times, stage: L.stage,
                              ratedCount: save.ratedCount, kMul: part.kMul, gained: d.gained, lost: d.lost });
    save.rating = res.newRating; save.ratedCount++;
    d.gained = res.gained; d.lost = res.lost; d.end = save.rating;
    d.lessons++; d.ok += st.ok; d.bad += st.bad;
    if (pass && !rec) d.opened.push(L.id);
    if (part.id === 'new') d.lastNew = L.id;
    over = d.partSec >= part.seconds;
  }
  writeSave();
  updateElo();
  document.querySelectorAll('.next').forEach(e => e.classList.remove('next'));
  document.querySelectorAll('.fg.on').forEach(e => e.classList.remove('on'));
  const next = st.idx + 1 < LESSONS.length ? st.idx + 1 : -1;
  const again = { label: 'Làm lại', fn: () => startLesson(st.idx) };
  const toMap = { label: 'Lộ trình', fn: showMap };
  let main, rest;
  if (res) {
    const d = sess.day, last = d.part === PARTS.length - 1;
    main = { label: over ? (last ? 'Xem tổng kết' : `Sang phần ${PARTS[d.part + 1].name}`) : 'Tiếp tục', fn: nextStep };
    rest = [];
  } else if (pass) {
    main = next >= 0 ? { label: 'Bài tiếp theo', fn: () => startLesson(next) } : { label: 'Về lộ trình', fn: showMap };
    rest = [again, ...(next >= 0 ? [toMap] : [])];
  } else { main = again; rest = [toMap]; }
  document.getElementById('r-title').textContent = pass ? (next >= 0 ? 'Xong bài rồi, giỏi lắm!' : 'Hoàn thành cả lộ trình!') : (res ? 'Gần được rồi, lần sau sẽ tốt hơn!' : 'Gần được rồi, mình làm lại nhé!');
  document.getElementById('r-acc').textContent = acc + '%';
  document.getElementById('r-acc').parentNode.className = 'rstat ' + (pass ? 'good' : 'low');
  document.getElementById('r-bad').textContent = st.bad;
  document.getElementById('r-need').textContent = PV.CFG.PASS_ACCURACY + '%';
  const sub = pass ? (next >= 0 ? `Đã mở: ${LESSONS[next].title}` : '') : (res ? `Cần đạt ${PV.CFG.PASS_ACCURACY}% chính xác để mở bài kế.` : `Cần đạt ${PV.CFG.PASS_ACCURACY}% chính xác để sang bài kế.`);
  document.getElementById('r-sub').textContent = sub;
  const ptsEl = document.getElementById('r-pts');
  ptsEl.textContent = '';
  if (res) {
    const a = res.applied;

    ptsEl.textContent = (a > 0 ? '+' : a < 0 ? '-' : '') + Math.abs(a) + ' điểm';
    const sm = document.createElement('small');

  } else { ptsEl.className = ''; ptsEl.textContent = 'Tập thêm, không tính điểm'; }
  const box = document.getElementById('r-btns');

  });
  resultAction = main.fn;
  setMode('result');
}

/* ---------- Điểm ở thanh trên ---------- */
function pad2(n) { return String(n).padStart(2, '0'); }
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
const signed = n => (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(n);
function updateElo() {

  const d = save.days[todayKey()];

/* ---------- Buổi tập 15 phút ---------- */
const FAST = new URLSearchParams(location.search).get('fast') === '1';   // chỉ để kiểm thử: mỗi phần 15 giây
const PARTS = RATING.SESSION_PARTS.map(p => Object.assign({}, p, { seconds: FAST ? 15 : p.seconds }));
const IDLE_MS = 20000;      // không gõ quá 20 giây thì đồng hồ buổi tạm dừng
let sess = null;            // { key, day } khi đang trong buổi
let lastKeyAt = 0;          // thời điểm bấm phím gần nhất (performance.now)
let lastTick = performance.now(), lastSaveAt = 0;

const fmtMin = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + pad2(s % 60); };

function newDay() {
  return { start: save.rating, end: save.rating, gained: 0, lost: 0, seconds: 0, lessons: 0, ok: 0, bad: 0, done: false,
           part: 0, partSec: 0, lastNew: null, opened: [] };
}
function todayDay() { const d = save.days[todayKey()]; return d && typeof d === 'object' ? d : null; }

/** Chọn bài cho một phần của buổi. */
function pickLesson(p) {
  const passed = LESSONS.map((l, i) => i).filter(i => isPassed(LESSONS[i].id));
  const todo = firstTodo();
  const cur = todo >= 0 ? todo : LESSONS.length - 1;       // "bài hiện tại"
  const rnd = a => a[Math.floor(Math.random() * a.length)];
  switch (PARTS[p].id) {
    case 'warm': {
      if (!passed.length) return cur;
      const pool = passed.length > 1 ? passed.filter(i => LESSONS[i].id !== sess.lastWarm) : passed;
      const i = rnd(pool); sess.lastWarm = LESSONS[i].id; return i;
    }
    case 'new': return todo >= 0 ? todo : rnd(passed);      // bài chưa qua đầu tiên; qua hết rồi thì ôn bài bất kỳ
    case 'practice': {                                       // bài vừa học ở phần Bài mới (qua rồi hay chưa đều ôn lại)
      const k = sess.day.lastNew ? LESSONS.findIndex(l => l.id === sess.day.lastNew) : -1;
      return k >= 0 ? k : cur;
    }
    default: return passed.length ? Math.max(...passed) : cur;   // thử thách: bài đã qua khó nhất
  }
}

function startSession() {
  const key = todayKey();
  let d = todayDay();
  if (d && d.done) { showHome(); return; }
  if (!d) { d = save.days[key] = newDay(); }
  sess = { key, day: d, lastWarm: null };
  writeSave();
  updateElo();
  nextStep();
}

/** Sang bài kế của buổi (hoặc phần kế, hoặc tổng kết). */
function nextStep() {
  const d = sess.day;
  while (d.part < PARTS.length && d.partSec >= PARTS[d.part].seconds) { d.part++; d.partSec = 0; }
  if (d.part >= PARTS.length) { finishSession(); return; }
  writeSave();
  startLesson(pickLesson(d.part), { ctx: 'session', lines: PARTS[d.part].lines });
}

function finishSession() {
  const d = sess.day;
  d.done = true; d.end = save.rating;
  writeSave();
  sess = null;
  updateElo();
  showHome(true);
}

function leaveSession() { writeSave(); sess = null; showHome(); }

/* Đồng hồ buổi: chạy khi trang đang hiện và bé có gõ trong 20 giây gần nhất; ngừng thì "Tạm dừng". */
function tick() {
  const now = performance.now(), dt = Math.min((now - lastTick) / 1000, 1);
  lastTick = now;
  if (!sess || st.ctx !== 'session' || (mode !== 'lesson' && mode !== 'result')) return;
  const d = sess.day, part = PARTS[d.part];
  const active = mode === 'lesson' && document.visibilityState === 'visible' && now - lastKeyAt <= IDLE_MS;
  if (active) { d.partSec += dt; d.seconds += dt; }
  if (now - lastSaveAt > 3000) { lastSaveAt = now; writeSave(); }
  // Thanh tiến độ
  const nameEl = document.getElementById('sb-name'), segsEl = document.getElementById('sb-segs'), timeEl = document.getElementById('sb-time');
  if (!segsEl.children.length) {
    PARTS.forEach(p => { const s = document.createElement('div'); s.className = 'seg'; s.style.setProperty('--s', p.seconds); s.title = p.name; s.append(document.createElement('i')); segsEl.append(s); });
  }
  [...segsEl.children].forEach((s, i) => {
    s.classList.toggle('cur', i === d.part);
    s.firstChild.style.setProperty('--p', (i < d.part ? 100 : i === d.part ? Math.min(100, d.partSec * 100 / PARTS[i].seconds) : 0).toFixed(1) + '%');
  });
  nameEl.textContent = '';
  nameEl.append(part.name);
  const sm = document.createElement('small'); sm.textContent = `${d.part + 1}/${PARTS.length}`; nameEl.append(sm);
  const rest = part.seconds - d.partSec;
  timeEl.className = active || mode === 'result' ? '' : 'paused';
  timeEl.textContent = mode === 'result' ? (rest <= 0 ? 'Hết giờ phần này' : 'Còn ' + fmtMin(rest))
    : !active ? 'Tạm dừng' : rest <= 0 ? 'Làm nốt bài này' : 'Còn ' + fmtMin(rest);
}
setInterval(tick, 250);
document.addEventListener('visibilitychange', () => { lastTick = performance.now(); if (document.visibilityState === 'hidden') writeSave(); });
addEventListener('pagehide', () => writeSave());

/* ---------- Trang chủ và tổng kết buổi ---------- */
const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const homeEl = document.getElementById('home');
function bigBtn(label, cls, fn, big) {
  const b = mk('button', 'btn ' + cls + (big ? ' btn-big' : ''), label);
  b.type = 'button';
  b.addEventListener('click', () => { b.blur(); fn(); });
  return b;
}
function ratingBlock(d) {
  const box = mk('div', 'elo-big');
  box.append(mk('span', '', 'Điểm'));
  if (d && d.done) {
    box.append(mk('b', '', `${d.start} → ${d.end}`));
    const ch = d.end - d.start;
    box.append(mk('em', ch > 0 ? 'up' : ch < 0 ? 'down' : '', signed(ch)));
  } else {
    box.append(mk('b', '', String(save.rating)));
    const ch = d ? save.rating - d.start : 0;
    if (d) box.append(mk('em', ch > 0 ? 'up' : ch < 0 ? 'down' : '', signed(ch) + ' hôm nay'));
  }
  return box;
}
const partsText = () => PARTS.map(p => `${p.name} ${FAST ? p.seconds + ' giây' : Math.round(p.seconds / 60) + ' phút'}`).join(' · ');

function showHome(justFinished) {
  const d = todayDay();
  homeEl.textContent = '';
  document.querySelectorAll('.next').forEach(e => e.classList.remove('next'));
  document.querySelectorAll('.fg.on').forEach(e => e.classList.remove('on'));
  st.ctx = 'free';
  let main;
  if (d && d.done) {
    const tot = d.ok + d.bad, acc = tot ? Math.round(d.ok * 100 / tot) : 0, ch = d.end - d.start;
    homeEl.append(mk('div', 'eyebrow', 'Buổi tập hôm nay'));
    homeEl.append(mk('h2', '', justFinished ? 'Hết giờ rồi, xong buổi tập!' : 'Hôm nay đã xong buổi tập!'));
    homeEl.append(ratingBlock(d));
    const stats = mk('div', 'rstats');
    [[d.lessons, 'Bài đã làm', ''], [acc + '%', 'Chính xác chung', acc >= PV.CFG.PASS_ACCURACY ? 'good' : 'low'], [Math.max(1, Math.round(d.seconds / 60)), 'Phút tập', '']].forEach(([v, l, c]) => {
      const t = mk('div', 'rstat ' + c); t.append(mk('b', '', String(v)), mk('span', '', l)); stats.append(t);
    });
    homeEl.append(stats);
    const opened = d.opened.map(id => PV.byId[id]).filter(Boolean).map(l => l.title);
    homeEl.append(mk('div', 'htext', opened.length ? `Bài mới mở được: ${opened.slice(0, 3).join(', ')}${opened.length > 3 ? ` và ${opened.length - 3} bài nữa` : ''}` : 'Hôm nay chưa mở thêm bài mới.'));
    homeEl.append(mk('div', 'htext muted', acc >= 95 ? 'Gõ chuẩn quá, gần như không sai phím nào!' : ch > 0 ? 'Điểm đang lên, cứ thế phát huy nhé!' : 'Chậm mà chắc, mai mình tập tiếp nhé!'));
    const t = firstTodo();
    const row = mk('div', 'rbtns');
    main = { fn: () => startLesson(t < 0 ? LESSONS.length - 1 : t) };
    row.append(bigBtn('Luyện thêm', 'gold', main.fn), bigBtn('Lộ trình', 'purple', showMap));
    homeEl.append(row, mk('div', 'htext muted', 'Luyện thêm vẫn chấm qua bài nhưng không đổi điểm.'));
  } else {
    const resume = !!d;
    homeEl.append(mk('div', 'eyebrow', 'Buổi tập 15 phút'));
    homeEl.append(ratingBlock(d));
    main = { fn: startSession };
    homeEl.append(bigBtn(resume ? 'Tiếp tục buổi tập' : 'Bắt đầu buổi tập hôm nay', 'gold', main.fn, true));
    if (resume) {
      const left = PARTS.reduce((s, p, i) => s + (i < d.part ? 0 : i === d.part ? Math.max(0, p.seconds - d.partSec) : p.seconds), 0);
      homeEl.append(mk('div', 'htext', `Còn khoảng ${fmtMin(left)} nữa là xong buổi hôm nay.`));
    } else homeEl.append(mk('div', 'htext', partsText()));
    const row = mk('div', 'rbtns');
    row.append(bigBtn('Lộ trình', 'purple', showMap));
    homeEl.append(row);
  }
  resultAction = main.fn;
  setMode('home');
  updateElo();
}

/* ---------- Bản đồ lộ trình ---------- */
function showMap() {
  const todo = firstTodo();
  mapEl.textContent = '';
  for (const S of PV.STAGES) {
    const idxs = LESSONS.map((l, i) => i).filter(i => LESSONS[i].stage === S.id);
    const open = isOpen(idxs[0]);
    const doneN = idxs.filter(i => isPassed(LESSONS[i].id)).length;
    const row = document.createElement('div');
    row.className = 'stage' + (open ? '' : ' locked');
    const num = document.createElement('div');
    num.className = 'snum ' + (doneN === idxs.length ? 'gold' : 'purple');
    num.textContent = S.id;
    const info = document.createElement('div');
    info.className = 'sinfo';
    const b = document.createElement('b'); b.textContent = S.title;
    if (S.optional) { const t = document.createElement('em'); t.textContent = 'Tùy chọn'; b.append(t); }
    const sm = document.createElement('small'); sm.textContent = `${S.sub}  (${doneN}/${idxs.length})`;
    info.append(b, sm);
    const ls = document.createElement('div');
    ls.className = 'lessons';
    for (const i of idxs) {
      const L = LESSONS[i], btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'ls' + (isPassed(L.id) ? ' done' : isOpen(i) ? ' open' : '') + (i === todo ? ' now' : '');
      btn.textContent = isPassed(L.id) ? '✓' : (L.final ? 'Ôn' : L.n);
      btn.title = `${L.title}`;
      btn.setAttribute('aria-label', `Chặng ${S.id}, bài ${L.n}: ${L.title}`);
      btn.disabled = !isOpen(i);
      btn.addEventListener('click', () => startLesson(i));
      ls.append(btn);
    }
    row.append(num, info, ls);
    mapEl.append(row);
  }
  document.querySelectorAll('.next').forEach(e => e.classList.remove('next'));
  document.querySelectorAll('.fg.on').forEach(e => e.classList.remove('on'));
  resultAction = null;
  st.ctx = 'free';
  setMode('map');
}
document.getElementById('btn-map').addEventListener('click', e => {
  e.currentTarget.blur();
  if (mode === 'map') showHome();
  else if (document.body.classList.contains('in-sess')) leaveSession();   // thoát buổi: tiến độ đã lưu, mở lại sẽ tiếp tục
  else showMap();
});

/* ---------- Nhận phím từ bàn phím rời ---------- */
function codeOf(e) {
  if (e.code && keyEls[e.code]) return e.code;
  const m = charMap[e.key];              // một số bàn phím bluetooth không gửi e.code
  if (m) return m.code;
  return keyEls[e.key] ? e.key : null;   // Enter, Tab, Backspace...
}

addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const ime = e.isComposing || e.keyCode === 229 || e.key === 'Unidentified' || e.key === 'Process';
  warnEl.hidden = !ime;
  diagEl.textContent = `key="${e.key}"  code="${e.code}"`;
  if (ime) return;
  lastKeyAt = performance.now();
  if ((mode === 'result' || mode === 'home') && e.key === 'Enter' && resultAction) { e.preventDefault(); if (!e.repeat) resultAction(); return; }
  const code = codeOf(e);
  if (code) keyEls[code].classList.add('down');
  if (e.key.length === 1 || ['Tab', 'Backspace', 'Enter'].includes(e.key)) e.preventDefault();
  if (e.repeat) return;
  if (e.key.length === 1 && mode === 'lesson') typeChar(e.key, code);
});
addEventListener('keyup', e => { const c = codeOf(e); if (c) keyEls[c].classList.remove('down'); });
addEventListener('blur', () => document.querySelectorAll('.key.down').forEach(k => k.classList.remove('down')));

/* Chạm vào phím ảo cũng tính, để thử khi chưa nối bàn phím */
kbEl.addEventListener('pointerdown', e => {
  const k = e.target.closest('.key');
  if (!k) return;
  e.preventDefault();
  const code = k.dataset.code;
  flash(k, 'down', 120);
  if (mode !== 'lesson') return;
  lastKeyAt = performance.now();
  const want = curText()[st.pos], t = charMap[want];
  if (code.startsWith('Shift')) return;
  // Chạm đúng phím thì coi như gõ đúng ký tự (kể cả ký tự cần Shift)
  if (t && t.code === code) typeChar(want, code);
  else { const hit = Object.keys(charMap).find(c => charMap[c].code === code && !charMap[c].shift); if (hit) typeChar(hit, code); }
});

/* ---------- Toàn màn hình + khóa ngang ---------- */
document.getElementById('fs').addEventListener('click', async e => {
  e.currentTarget.blur();
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else {
      await document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape').catch(() => {});
    }
  } catch (_) {}
});
document.addEventListener('fullscreenchange', () => {
  document.getElementById('fs').textContent = document.fullscreenElement ? 'Thoát toàn màn hình' : 'Toàn màn hình';
});

showHome();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
